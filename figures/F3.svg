<text x="52" y="551" fill="#2A2D2F" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" >cs.AI submissions: more than 6× in 2024–2026; other categories roughly doubled.</text>
<text x="52" y="602" fill="#161819" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" >Submissions doubled in two years. From 1 October 2026 each submitter may send two papers a month — rejected ones count.</text>
<text x="52" y="653" fill="#2A2D2F" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" >arXiv attributes a disproportionate share of moderator time to a relatively small proportion of authors.</text>
