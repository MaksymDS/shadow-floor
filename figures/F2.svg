<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="765" viewBox="0 0 1200 765" role="img" aria-labelledby="title desc">
<title id="title">Music: half of what is uploaded, a sliver of what is heard</title>
<desc id="desc">Shadow 06 figure F2. Exact plotted values are encoded on marks.</desc>
<rect width="1200" height="765" fill="#EDE0C8"/>
<text x="52" y="36" fill="#8B2D2D" font-family="JetBrains Mono,monospace" font-size="12" font-weight="600" text-anchor="start" >SHADOW 06  /  FIGURE 2</text>
<text x="52" y="78" fill="#161819" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="600" text-anchor="start" >Music: half of what is uploaded, a sliver of what is heard</text>
<line x1="52" y1="98" x2="1148" y2="98" stroke="#9C907A" stroke-width="1" />
<text x="52" y="145" fill="#2A2D2F" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="start" >JUNE 2026 · SHARE OF DAILY ACTIVITY</text>
<line x1="340" y1="176" x2="340" y2="370" stroke="#9C907A" stroke-width="0.7" stroke-dasharray="3 5" />
<text x="340" y="390" fill="#2A2D2F" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="middle" >0%</text>
<line x1="480" y1="176" x2="480" y2="370" stroke="#9C907A" stroke-width="0.7" stroke-dasharray="3 5" />
<text x="480" y="390" fill="#2A2D2F" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="middle" >10%</text>
<line x1="620" y1="176" x2="620" y2="370" stroke="#9C907A" stroke-width="0.7" stroke-dasharray="3 5" />
<text x="620" y="390" fill="#2A2D2F" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="middle" >20%</text>
<line x1="760" y1="176" x2="760" y2="370" stroke="#9C907A" stroke-width="0.7" stroke-dasharray="3 5" />
<text x="760" y="390" fill="#2A2D2F" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="middle" >30%</text>
<line x1="900" y1="176" x2="900" y2="370" stroke="#9C907A" stroke-width="0.7" stroke-dasharray="3 5" />
<text x="900" y="390" fill="#2A2D2F" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="middle" >40%</text>
<line x1="1040" y1="176" x2="1040" y2="370" stroke="#9C907A" stroke-width="0.7" stroke-dasharray="3 5" />
<text x="1040" y="390" fill="#2A2D2F" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="middle" >50%</text>
<text x="52" y="225" fill="#161819" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start" >Share of daily uploads</text>
<rect x="340" y="198" width="700" height="34" fill="#8B2D2D" data-row="2" data-field="share_of_daily_uploads_pct" data-value="50" data-x="340" data-scale="14"/>
<text x="1110" y="224" fill="#161819" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="end" >50%</text>
<text x="52" y="321" fill="#161819" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start" >Share of streams</text>
<rect x="354" y="292" width="28" height="34" fill="#6E8499" data-row="2" data-field="share_of_streams_pct_low" data-value="1" data-x="354" data-scale="14" data-high="3"/>
<line x1="354" y1="286" x2="354" y2="334" stroke="#161819" stroke-width="1.5" />
<line x1="382" y1="286" x2="382" y2="334" stroke="#161819" stroke-width="1.5" data-row="2" data-field="share_of_streams_pct_high" data-value="3" data-x="382" data-scale="14"/>
<text x="1110" y="321" fill="#161819" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="end" >1–3%</text>
<text x="52" y="445" fill="#2A2D2F" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="start" >FULLY AI-GENERATED TRACKS UPLOADED PER DAY</text>
<circle cx="185" cy="495" r="8" fill="#8B2D2D" data-row="0" data-field="ai_tracks_per_day" data-value="10000" data-x="185" data-y="495"/>
<text x="185" y="475" fill="#161819" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600" text-anchor="middle" >10,000</text>
<text x="185" y="523" fill="#2A2D2F" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="middle" >JAN 2025</text>
<circle cx="595" cy="495" r="8" fill="#8B2D2D" data-row="1" data-field="ai_tracks_per_day" data-value="75000" data-x="595" data-y="495"/>
<text x="595" y="475" fill="#161819" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600" text-anchor="middle" >75,000</text>
<text x="595" y="523" fill="#2A2D2F" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="middle" >APR 2026</text>
<circle cx="1005" cy="495" r="8" fill="#8B2D2D" data-row="2" data-field="ai_tracks_per_day" data-value="90000" data-x="1005" data-y="495"/>
<text x="1005" y="475" fill="#161819" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600" text-anchor="middle" >90,000</text>
<text x="1005" y="523" fill="#2A2D2F" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="middle" >JUN 2026</text>
<text x="52" y="587" fill="#161819" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" >Fully AI-generated tracks passed half of Deezer&#x27;s daily uploads in June 2026, yet accounted for 1–3% of listening; Deezer found up</text>
<text x="52" y="609" fill="#161819" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" >to 85% of their streams were fraudulent.</text>
<line x1="52" y1="676" x2="1148" y2="676" stroke="#9C907A" stroke-width="1" />
<text x="52" y="704" fill="#2A2D2F" font-family="JetBrains Mono,monospace" font-size="11" font-weight="400" text-anchor="start" >SOURCE  Deezer newsroom · Deezer: AI-generated tracks now represent 44% of all new uploaded music (20 Apr 2026); Deezer: AI music has surpassed 50% of new</text>
<text x="52" y="721" fill="#2A2D2F" font-family="JetBrains Mono,monospace" font-size="11" font-weight="400" text-anchor="start" >music uploads for the first time (21 Jul 2026) · A26–A28 · vendor data.</text>
</svg>
