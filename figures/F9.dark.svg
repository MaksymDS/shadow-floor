<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Practice versus exam</title>
<desc id="desc">Shadow 06 figure F9. Exact plotted values are encoded on marks.</desc>
<rect width="1200" height="720" fill="#161819"/>
<text x="52" y="36" fill="#E8B547" font-family="JetBrains Mono,monospace" font-size="12" font-weight="600" text-anchor="start" >SHADOW 06  /  FIGURE 9</text>
<text x="52" y="78" fill="#EDE0C8" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="600" text-anchor="start" >Practice versus exam</text>
<line x1="52" y1="98" x2="1148" y2="98" stroke="#2A2D2F" stroke-width="1" />
<line x1="100" y1="430" x2="1090" y2="430" stroke="#2A2D2F" stroke-width="0.8" stroke-dasharray="3 5" />
<text x="90" y="434" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="end" >-20%</text>
<line x1="100" y1="398.5" x2="1090" y2="398.5" stroke="#EDE0C8" stroke-width="1.4" />
<text x="90" y="402.5" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="end" >0</text>
<line x1="100" y1="335.5" x2="1090" y2="335.5" stroke="#2A2D2F" stroke-width="0.8" stroke-dasharray="3 5" />
<text x="90" y="339.5" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="end" >+40%</text>
<line x1="100" y1="272.5" x2="1090" y2="272.5" stroke="#2A2D2F" stroke-width="0.8" stroke-dasharray="3 5" />
<text x="90" y="276.5" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="end" >+80%</text>
<line x1="100" y1="209.5" x2="1090" y2="209.5" stroke="#2A2D2F" stroke-width="0.8" stroke-dasharray="3 5" />
<text x="90" y="213.5" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="end" >+120%</text>
<text x="1074" y="389.5" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="11" font-weight="400" text-anchor="end" >CONTROL</text>
<rect x="247" y="322.9" width="76" height="75.6" fill="#6E8499" data-row="0" data-field="practice_vs_control_pct" data-value="48" data-zero="398.5" data-scale="1.575"/>
<text x="285" y="310.9" fill="#EDE0C8" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" >+48%</text>
<text x="285" y="478" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="11" font-weight="400" text-anchor="middle" >GPT BASE</text>
<rect x="352" y="198.475" width="76" height="200.025" fill="#E8B547" data-row="1" data-field="practice_vs_control_pct" data-value="127" data-zero="398.5" data-scale="1.575"/>
<text x="390" y="186.475" fill="#EDE0C8" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" >+127%</text>
<text x="390" y="478" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="11" font-weight="400" text-anchor="middle" >GPT TUTOR</text>
<rect x="717" y="398.5" width="76" height="26.775" fill="#6E8499" data-row="0" data-field="exam_vs_control_pct" data-value="-17" data-zero="398.5" data-scale="1.575"/>
<text x="755" y="452.275" fill="#EDE0C8" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" >−17%</text>
<text x="755" y="478" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="11" font-weight="400" text-anchor="middle" >GPT BASE</text>
<line x1="822" y1="398.5" x2="898" y2="398.5" stroke="#E8B547" stroke-width="6" data-row="1" data-field="exam_vs_control_pct" data-value="0" data-zero="398.5" data-scale="1.575"/>
<text x="860" y="425.5" fill="#EDE0C8" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" >≈0</text>
<text x="860" y="478" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="11" font-weight="400" text-anchor="middle" >GPT TUTOR</text>
<text x="340" y="516" fill="#EDE0C8" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" >PRACTICE</text>
<text x="807" y="516" fill="#EDE0C8" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle" >EXAM WITHOUT AI</text>
<text x="52" y="557" fill="#EDE0C8" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" >Unrestricted access improved practice scores by 48% and lowered exam scores by 17% once access was removed. A tutor designed not</text>
<text x="52" y="579" fill="#EDE0C8" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" >to hand out answers removed the loss.</text>
<text x="52" y="631" fill="#9C907A" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" >Fan et al. (BJET) — ChatGPT group improved essay scores most; knowledge gain and transfer did not differ (D08).</text>
<line x1="52" y1="662" x2="1148" y2="662" stroke="#2A2D2F" stroke-width="1" />
<text x="52" y="690" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="11" font-weight="400" text-anchor="start" >SOURCE  Bastani et al. · Generative AI without guardrails can harm learning: Evidence from high school mathematics · PNAS 122(26), 2025 · D01–D02; companion</text>
<text x="52" y="707" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="11" font-weight="400" text-anchor="start" >D08.</text>
</svg>
