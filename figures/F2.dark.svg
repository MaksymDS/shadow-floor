<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="805" viewBox="0 0 1200 805" role="img" aria-labelledby="title desc">
<title id="title">Music: half of what is uploaded, a sliver of what is heard</title>
<desc id="desc">Shadow 06 figure F2. Exact plotted values are encoded on marks.</desc>
<rect width="1200" height="805" fill="#161819"/>
<text x="52" y="36" fill="#E8B547" font-family="JetBrains Mono,monospace" font-size="12" font-weight="600" text-anchor="start" >SHADOW 06  /  FIGURE 2</text>
<text x="52" y="78" fill="#EDE0C8" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="600" text-anchor="start" >Music: half of what is uploaded, a sliver of what is heard</text>
<line x1="52" y1="98" x2="1148" y2="98" stroke="#2A2D2F" stroke-width="1" />
<text x="52" y="145" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="start" >JUNE 2026 · SHARE OF DAILY ACTIVITY</text>
<line x1="340" y1="176" x2="340" y2="370" stroke="#2A2D2F" stroke-width="0.7" stroke-dasharray="3 5" />
<text x="340" y="390" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="middle" >0%</text>
<line x1="480" y1="176" x2="480" y2="370" stroke="#2A2D2F" stroke-width="0.7" stroke-dasharray="3 5" />
<text x="480" y="390" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="middle" >10%</text>
<line x1="620" y1="176" x2="620" y2="370" stroke="#2A2D2F" stroke-width="0.7" stroke-dasharray="3 5" />
<text x="620" y="390" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="middle" >20%</text>
<line x1="760" y1="176" x2="760" y2="370" stroke="#2A2D2F" stroke-width="0.7" stroke-dasharray="3 5" />
<text x="760" y="390" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="middle" >30%</text>
<line x1="900" y1="176" x2="900" y2="370" stroke="#2A2D2F" stroke-width="0.7" stroke-dasharray="3 5" />
<text x="900" y="390" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="middle" >40%</text>
<line x1="1040" y1="176" x2="1040" y2="370" stroke="#2A2D2F" stroke-width="0.7" stroke-dasharray="3 5" />
<text x="1040" y="390" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="middle" >50%</text>
<text x="52" y="225" fill="#EDE0C8" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start" >Share of daily uploads</text>
<rect x="340" y="198" width="700" height="34" fill="#E8B547" data-row="2" data-field="share_of_daily_uploads_label" data-value="over 50%" data-x="340" data-scale="14"/>
<text x="1040" y="194" fill="#E8B547" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" >≥</text>
<text x="1110" y="263" fill="#EDE0C8" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="end" >over 50%</text>
<text x="52" y="321" fill="#EDE0C8" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start" >Share of streams</text>
<rect x="354" y="292" width="28" height="34" fill="#6E8499" data-row="2" data-field="share_of_streams_label" data-value="1–3% (as of June 2026)" data-x="354" data-scale="14" data-high="3"/>
<line x1="354" y1="286" x2="354" y2="334" stroke="#EDE0C8" stroke-width="1.5" />
<line x1="382" y1="286" x2="382" y2="334" stroke="#EDE0C8" stroke-width="1.5" />
<text x="1110" y="321" fill="#EDE0C8" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="end" >1–3% (as of June 2026)</text>
<text x="52" y="445" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="start" >FULLY AI-GENERATED TRACKS UPLOADED PER DAY</text>
<circle cx="185" cy="495" r="8" fill="#E8B547" data-row="0" data-field="ai_tracks_per_day" data-value="10,000" data-x="185" data-y="495"/>
<text x="185" y="475" fill="#EDE0C8" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600" text-anchor="middle" >10,000</text>
<text x="185" y="523" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="middle" >JAN 2025</text>
<circle cx="595" cy="495" r="8" fill="#E8B547" data-row="1" data-field="ai_tracks_per_day" data-value="75,000" data-x="595" data-y="495"/>
<text x="595" y="475" fill="#EDE0C8" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600" text-anchor="middle" >75,000</text>
<text x="595" y="523" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="middle" >APR 2026</text>
<text x="595" y="549" fill="#9C907A" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle" data-row="1" data-field="share_of_daily_uploads_label" data-value="roughly 44%">roughly 44%</text>
<circle cx="1005" cy="495" r="8" fill="#E8B547" data-row="2" data-field="ai_tracks_per_day" data-value="90,000" data-x="1005" data-y="495"/>
<text x="1005" y="475" fill="#EDE0C8" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600" text-anchor="middle" >90,000</text>
<text x="1005" y="523" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="12" font-weight="400" text-anchor="middle" >JUN 2026 PEAK</text>
<g data-text-role="caption">
<text x="52" y="587" fill="#EDE0C8" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" >Deezer reports that fully AI-generated tracks exceeded half of daily uploads at a June 2026 peak, and accounted for 1–3% of</text>
<text x="52" y="609" fill="#EDE0C8" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" >streams; it classified up to 85% of those streams in 2025 as fraudulent. Upload share and stream share are different measures.</text>
</g>
<g data-text-role="source">
<line x1="52" y1="676" x2="1148" y2="676" stroke="#2A2D2F" stroke-width="1" />
<text x="52" y="704" fill="#9C907A" font-family="JetBrains Mono,monospace" font-size="11" font-weight="400" text-anchor="start" >SOURCE  Deezer newsroom, April 2026 and 21 July 2026.</text>
</g>
</svg>
